<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MES MJAY MP4</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #060608;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 65px 20px;
      text-align: center;
      background:
        radial-gradient(circle at 20% 20%, #6800a8, transparent 35%),
        radial-gradient(circle at 80% 70%, #b00055, transparent 35%),
        #08080c;
    }

    .logo {
      font-size: clamp(38px, 8vw, 75px);
      font-weight: 900;
      letter-spacing: 5px;
      margin: 0;
      background: linear-gradient(90deg, #fff, #b75cff, #ff2385);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      color: #bbaec5;
      letter-spacing: 3px;
      margin: 20px 0 35px;
    }

    .search-area {
      max-width: 800px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    #search {
      flex: 1;
      padding: 18px 22px;
      border-radius: 40px;
      border: 1px solid #38343f;
      background: #121117;
      color: white;
      font-size: 16px;
      outline: none;
    }

    #searchButton {
      padding: 0 25px;
      border: 0;
      border-radius: 40px;
      background: linear-gradient(90deg, #7200ff, #ff0066);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .categories {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .category {
      padding: 10px 17px;
      border-radius: 30px;
      border: 1px solid #37323e;
      background: #121117;
      color: #ddd;
      cursor: pointer;
    }

    .category:hover {
      background: linear-gradient(90deg, #7200ff, #ff0066);
      color: white;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 45px 20px;
    }

    .section-title {
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    #status {
      text-align: center;
      color: #aaa;
      padding: 25px;
    }

    #results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
    }

    .card {
      background: #111116;
      border: 1px solid #24222b;
      border-radius: 18px;
      overflow: hidden;
    }

    .thumbnail {
      width: 100%;
      height: 190px;
      object-fit: cover;
      display: block;
    }

    .placeholder {
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      background: linear-gradient(135deg, #7200ff, #ff0066);
    }

    .card-content {
      padding: 18px;
    }

    .source {
      display: inline-block;
      padding: 5px 9px;
      margin-bottom: 10px;
      border-radius: 20px;
      background: #25252c;
      color: #bbb;
      font-size: 11px;
      font-weight: bold;
    }

    .youtube-source {
      background: #d90000;
      color: white;
    }

    .local-source {
      background: #00a86b;
      color: white;
    }

    .title {
      font-weight: bold;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .artist {
      color: #999;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .button {
      flex: 1;
      min-width: 100px;
      padding: 11px;
      border-radius: 9px;
      text-align: center;
      border: 0;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }

    .listen {
      background: #7200ff;
      color: white;
    }

    .download {
      background: #00a86b;
      color: white;
    }

    .player {
      display: none;
      margin-top: 15px;
    }

    .player iframe {
      width: 100%;
      height: 220px;
      border: 0;
      border-radius: 10px;
    }

    .player audio {
      width: 100%;
    }

    .upload-section {
      max-width: 800px;
      margin: 60px auto;
      padding: 30px;
      background: #111116;
      border: 1px solid #24222b;
      border-radius: 18px;
    }

    .upload-section input,
    .upload-section textarea {
      width: 100%;
      margin-bottom: 12px;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #33303a;
      background: #08080b;
      color: white;
    }

    .upload-section textarea {
      min-height: 100px;
      resize: vertical;
    }

    #uploadButton {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: linear-gradient(90deg, #7200ff, #ff0066);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #uploadStatus {
      margin-top: 15px;
      color: #aaa;
      text-align: center;
    }

    footer {
      padding: 40px 20px;
      text-align: center;
      color: #666;
      border-top: 1px solid #1c1c20;
    }

    @media (max-width: 650px) {
      .search-area {
        flex-direction: column;
      }

      #searchButton {
        padding: 15px;
      }
    }
  </style>

</head>

<body>

<header>

  <h1 class="logo">MES MJAY MP4</h1>

  <p class="tagline">
    SEARCH • LISTEN • UPLOAD • DOWNLOAD
  </p>

  <div class="search-area">

```
<input
  id="search"
  type="search"
  placeholder="Search songs, DJs or mixes..."
>

<button id="searchButton">
  SEARCH
</button>
```

  </div>

  <div class="categories">

```
<button class="category" data-query="Amapiano DJ Mix">
  🎧 Amapiano
</button>

<button class="category" data-query="Afro House DJ Mix">
  🔥 Afro House
</button>

<button class="category" data-query="Hip Hop DJ Mix">
  🎤 Hip Hop
</button>

<button class="category" data-query="Dancehall DJ Mix">
  💃 Dancehall
</button>
```

  </div>

</header>

<main>

  <h2 class="section-title">
    🔥 SEARCH RESULTS
  </h2>

  <div id="status">
    Search for a song, DJ or mix.
  </div>

  <div id="results"></div>

  <section class="upload-section">

```
<h2>📤 Upload Your Mix</h2>

<p>
  Upload music or mixes that you own
  or have permission to distribute.
</p>

<input
  id="uploadTitle"
  type="text"
  placeholder="Mix title"
>

<input
  id="uploadArtist"
  type="text"
  placeholder="DJ / Artist name"
>

<input
  id="uploadGenre"
  type="text"
  placeholder="Genre"
>

<textarea
  id="uploadDescription"
  placeholder="Description"
></textarea>

<input
  id="audioFile"
  type="file"
  accept="audio/mpeg,audio/mp4,audio/wav,video/mp4"
>

<button id="uploadButton">
  UPLOAD MIX
</button>

<div id="uploadStatus"></div>
```

  </section>

</main>

<footer>
  <strong>MES MJAY MP4</strong>
  <br><br>
  Search • Listen • Upload • Download
</footer>

<script>

/* =====================================================
   1. CONFIGURATION
===================================================== */


/*
   SUPABASE URL
*/

const SUPABASE_URL =
  "https://wnlajqbpkwtwpaaeqkxj.supabase.co";


/*
   SUPABASE PUBLISHABLE KEY

   Replace this with your Supabase publishable key.

   NEVER put a Supabase service_role/secret key here.
*/

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_PXAmzEH8fRfMkCH7czbiPA_kus8zu7R";


/*
   YOUTUBE API KEY

   Replace this with the NEW key from Google Cloud.
*/

const YOUTUBE_API_KEY =
  "AIzaSyDGq8I_PFGnDOGa4FG9eq6Ulc_gWhcQcTE";


/* =====================================================
   2. SUPABASE
===================================================== */

let supabaseClient = null;

if (
  SUPABASE_PUBLISHABLE_KEY &&
  !SUPABASE_PUBLISHABLE_KEY.includes("PASTE_")
) {

  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

}


/* =====================================================
   3. MAIN SEARCH
===================================================== */

async function searchEverything() {

  const query =
    document
      .getElementById("search")
      .value
      .trim();


  const results =
    document.getElementById("results");


  const status =
    document.getElementById("status");


  if (!query) {

    status.textContent =
      "Type a song, DJ or mix.";

    return;

  }


  results.innerHTML = "";

  status.textContent =
    "🔎 Searching YouTube and MES MJAY MP4...";


  await Promise.allSettled([

    searchYouTube(query),

    searchMyUploads(query)

  ]);


  if (!results.children.length) {

    status.textContent =
      "No results found.";

  } else {

    status.textContent =
      "✅ Results found";

  }

}


/* =====================================================
   4. YOUTUBE SEARCH
===================================================== */

async function searchYouTube(query) {

  if (
    !YOUTUBE_API_KEY ||
    YOUTUBE_API_KEY.includes("PASTE_")
  ) {

    showMessage(
      "YouTube",
      "YouTube API key has not been added."
    );

    return;

  }


  try {

    const url =
      "https://www.googleapis.com/youtube/v3/search" +

      "?part=snippet" +

      "&q=" +
      encodeURIComponent(query) +

      "&type=video" +

      "&videoEmbeddable=true" +

      "&maxResults=12" +

      "&key=" +
      encodeURIComponent(
        YOUTUBE_API_KEY
      );


    const response =
      await fetch(url);


    const data =
      await response.json();


    if (!response.ok) {

      console.error(
        "YouTube API ERROR:",
        data
      );


      let errorMessage =
        data?.error?.message ||
        "YouTube API request failed.";


      const reason =
        data?.error?.errors?.[0]?.reason;


      if (
        reason === "keyInvalid"
      ) {

        errorMessage =
          "Your YouTube API key is invalid.";

      }


      if (
        reason === "ipRefererBlocked"
      ) {

        errorMessage =
          "Your API key is blocked by its website restriction.";

      }


      if (
        reason === "quotaExceeded"
      ) {

        errorMessage =
          "YouTube API quota has been exceeded.";

      }


      showMessage(
        "YouTube ERROR",
        errorMessage
      );


      return;

    }


    if (
      !data.items ||
      data.items.length === 0
    ) {

      showMessage(
        "YouTube",
        "No YouTube results found."
      );

      return;

    }


    data.items.forEach(
      video => {

        const videoId =
          video?.id?.videoId;


        if (!videoId) {
          return;
        }


        const title =
          escapeHTML(
            video.snippet.title
          );


        const channel =
          escapeHTML(
            video.snippet.channelTitle
          );


        const thumbnail =
          video.snippet
            .thumbnails
            .high?.url ||
          video.snippet
            .thumbnails
            .medium?.url ||
          video.snippet
            .thumbnails
            .default?.url;


        const card =
          document.createElement(
            "article"
          );


        card.className =
          "card";


        card.innerHTML = `

          <img
            class="thumbnail"
            src="${thumbnail}"
            alt="${title}"
          >

          <div class="card-content">

            <div class="source youtube-source">
              YOUTUBE
            </div>

            <div class="title">
              ${title}
            </div>

            <div class="artist">
              ${channel}
            </div>

            <div class="buttons">

              <button
                class="button listen"
                onclick="
                  playYouTube(
                    '${escapeJS(videoId)}',
                    this
                  )
                "
              >
                ▶ LISTEN
              </button>

            </div>

            <div class="player"></div>

          </div>

        `;


        document
          .getElementById("results")
          .appendChild(card);

      }
    );

  }

  catch(error) {

    console.error(
      "YouTube connection error:",
      error
    );


    showMessage(
      "YouTube",
      "Could not connect to YouTube."
    );

  }

}


/* =====================================================
   5. PLAY YOUTUBE INSIDE YOUR WEBSITE
===================================================== */

function playYouTube(
  videoId,
  button
) {

  const card =
    button.closest(".card");


  const player =
    card.querySelector(".player");


  player.style.display =
    "block";


  player.innerHTML = `

    <iframe
      src="https://www.youtube.com/embed/${encodeURIComponent(videoId)}"
      title="YouTube player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>

  `;

}


/* =====================================================
   6. SEARCH YOUR SUPABASE MIXES
===================================================== */

async function searchMyUploads(query) {

  if (!supabaseClient) {
    return;
  }


  try {

    const safeQuery =
      query
        .replace(/,/g, " ")
        .trim();


    const {
      data,
      error
    } =
      await supabaseClient
        .from("mixes")
        .select("*")
        .or(
          `title.ilike.%${safeQuery}%,artist.ilike.%${safeQuery}%,genre.ilike.%${safeQuery}%`
        )
        .limit(30);


    if (error) {

      console.error(
        "Supabase ERROR:",
        error
      );

      return;

    }


    if (!data?.length) {
      return;
    }


    data.forEach(
      mix => {

        const title =
          escapeHTML(
            mix.title ||
            "Untitled Mix"
          );


        const artist =
          escapeHTML(
            mix.artist ||
            "Unknown DJ"
          );


        const genre =
          escapeHTML(
            mix.genre ||
            ""
          );


        const description =
          escapeHTML(
            mix.description ||
            ""
          );


        const audioURL =
          String(
            mix.audio_url ||
            ""
          );


        if (!audioURL) {
          return;
        }


        const card =
          document.createElement(
            "article"
          );


        card.className =
          "card";


        card.innerHTML = `

          <div class="placeholder">
            🎧
          </div>

          <div class="card-content">

            <div class="source local-source">
              MES MJAY MP4
            </div>

            <div class="title">
              ${title}
            </div>

            <div class="artist">

              ${artist}

              ${
                genre
                  ? " • " + genre
                  : ""
              }

            </div>

            <div
              style="
                color:#888;
                font-size:13px;
                margin-bottom:15px;
              "
            >
              ${description}
            </div>

            <div class="buttons">

              <button
                class="button listen"
                onclick="
                  playAudio(
                    '${escapeJS(audioURL)}',
                    this
                  )
                "
              >
                ▶ LISTEN
              </button>

              <a
                class="button download"
                href="${escapeAttribute(audioURL)}"
                download
                target="_blank"
                rel="noopener noreferrer"
              >
                ⬇ DOWNLOAD
              </a>

            </div>

            <div class="player"></div>

          </div>

        `;


        document
          .getElementById("results")
          .appendChild(card);

      }
    );

  }

  catch(error) {

    console.error(
      "Supabase search error:",
      error
    );

  }

}


/* =====================================================
   7. PLAY YOUR OWN AUDIO
===================================================== */

function playAudio(
  audioURL,
  button
) {

  const card =
    button.closest(".card");


  const player =
    card.querySelector(".player");


  player.style.display =
    "block";


  player.innerHTML = `

    <audio
      controls
      src="${escapeAttribute(audioURL)}"
    ></audio>

  `;

}


/* =====================================================
   8. UPLOAD YOUR OWN MIX
===================================================== */

async function uploadMix() {

  const status =
    document.getElementById(
      "uploadStatus"
    );


  if (!supabaseClient) {

    status.textContent =
      "Supabase is not configured.";

    return;

  }


  const title =
    document
      .getElementById("uploadTitle")
      .value
      .trim();


  const artist =
    document
      .getElementById("uploadArtist")
      .value
      .trim();


  const genre =
    document
      .getElementById("uploadGenre")
      .value
      .trim();


  const description =
    document
      .getElementById("uploadDescription")
      .value
      .trim();


  const file =
    document
      .getElementById("audioFile")
      .files[0];


  if (!title || !file) {

    status.textContent =
      "Enter a title and choose a file.";

    return;

  }


  status.textContent =
    "Uploading...";


  try {

    const safeName =
      file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


    const filePath =
      Date.now() +
      "-" +
      safeName;


    const {
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from("mixes")
        .upload(
          filePath,
          file
        );


    if (uploadError) {
      throw uploadError;
    }


    const {
      data: publicData
    } =
      supabaseClient
        .storage
        .from("mixes")
        .getPublicUrl(
          filePath
        );


    const audioURL =
      publicData.publicUrl;


    const {
      error: databaseError
    } =
      await supabaseClient
        .from("mixes")
        .insert({

          title: title,

          artist: artist,

          genre: genre,

          description: description,

          audio_url:
            audioURL

        });


    if (databaseError) {
      throw databaseError;
    }


    status.textContent =
      "✅ Mix uploaded successfully!";


    document
      .getElementById("uploadTitle")
      .value = "";


    document
      .getElementById("uploadArtist")
      .value = "";


    document
      .getElementById("uploadGenre")
      .value = "";


    document
      .getElementById("uploadDescription")
      .value = "";


    document
      .getElementById("audioFile")
      .value = "";

  }

  catch(error) {

    console.error(
      "Upload error:",
      error
    );


    status.textContent =
      "❌ Upload failed: " +
      (
        error.message ||
        "Check Supabase permissions."
      );

  }

}


/* =====================================================
   9. CATEGORY BUTTONS
===================================================== */

document
  .querySelectorAll(".category")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .getElementById("search")
          .value =
          button.dataset.query;


        searchEverything();

      }
    );

  });


/* =====================================================
   10. SEARCH BUTTON
===================================================== */

document
  .getElementById("searchButton")
  .addEventListener(
    "click",
    searchEverything
  );


/* =====================================================
   11. ENTER KEY
===================================================== */

document
  .getElementById("search")
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {

        searchEverything();

      }

    }
  );


/* =====================================================
   12. MESSAGE
===================================================== */

function showMessage(
  source,
  message
) {

  const card =
    document.createElement(
      "article"
    );


  card.className =
    "card";


  card.innerHTML = `

    <div class="placeholder">
      🔎
    </div>

    <div class="card-content">

      <div class="source">
        ${escapeHTML(source)}
      </div>

      <div class="title">
        ${escapeHTML(message)}
      </div>

    </div>

  `;


  document
    .getElementById("results")
    .appendChild(card);

}


/* =====================================================
   13. SECURITY HELPERS
===================================================== */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeJS(value) {

  return String(value)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\r/g, "\\r")
    .replace(/\n/g, "\\n");

}


function escapeAttribute(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
