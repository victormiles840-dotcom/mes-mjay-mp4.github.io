<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MES MJAY MP4</title>


  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      background: #060608;
      color: white;
      font-family: Arial, sans-serif;
    }


    header {

      padding: 70px 20px;

      text-align: center;

      background:
        radial-gradient(
          circle at 20% 20%,
          #6800a8,
          transparent 35%
        ),

        radial-gradient(
          circle at 80% 70%,
          #b00055,
          transparent 35%
        ),

        #08080c;
    }


    .logo {

      font-size: clamp(
        38px,
        8vw,
        75px
      );

      font-weight: 900;

      letter-spacing: 5px;

      margin: 0;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          #b75cff,
          #ff2385
        );

      -webkit-background-clip: text;

      -webkit-text-fill-color:
        transparent;
    }


    .tagline {

      color: #bbaec5;

      letter-spacing: 4px;

      margin: 20px 0 35px;
    }


    .search-area {

      max-width: 800px;

      margin: auto;

      display: flex;

      gap: 10px;
    }


    #search {

      flex: 1;

      padding: 18px 22px;

      border-radius: 40px;

      border: 1px solid #38343f;

      background: #121117;

      color: white;

      font-size: 16px;

      outline: none;
    }


    #searchButton {

      padding: 0 25px;

      border: 0;

      border-radius: 40px;

      background:
        linear-gradient(
          90deg,
          #7200ff,
          #ff0066
        );

      color: white;

      font-weight: bold;

      cursor: pointer;
    }


    .categories {

      margin-top: 25px;

      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 10px;
    }


    .category {

      padding: 10px 17px;

      border-radius: 30px;

      border: 1px solid #37323e;

      background: #121117;

      color: #ddd;

      cursor: pointer;
    }


    .category:hover {

      background:
        linear-gradient(
          90deg,
          #7200ff,
          #ff0066
        );

      color: white;
    }


    main {

      max-width: 1200px;

      margin: auto;

      padding: 50px 20px;
    }


    .section-title {

      margin-bottom: 25px;

      letter-spacing: 2px;
    }


    #status {

      text-align: center;

      color: #999;

      padding: 30px;
    }


    #results {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(280px, 1fr)
        );

      gap: 22px;
    }


    .card {

      background: #111116;

      border: 1px solid #24222b;

      border-radius: 18px;

      overflow: hidden;
    }


    .card img {

      width: 100%;

      height: 190px;

      object-fit: cover;

      display: block;
    }


    .card-content {

      padding: 18px;
    }


    .title {

      font-weight: bold;

      line-height: 1.5;

      margin-bottom: 10px;
    }


    .artist {

      color: #999;

      font-size: 13px;

      margin-bottom: 15px;
    }


    .buttons {

      display: flex;

      flex-wrap: wrap;

      gap: 8px;
    }


    .button {

      flex: 1;

      min-width: 100px;

      padding: 11px;

      border-radius: 9px;

      text-align: center;

      border: 0;

      text-decoration: none;

      font-weight: bold;

      cursor: pointer;
    }


    .listen {

      background: #7200ff;

      color: white;
    }


    .youtube {

      background: #25252c;

      color: white;
    }


    .download {

      background: #00a86b;

      color: white;
    }


    .player {

      display: none;

      margin-top: 15px;
    }


    .player iframe {

      width: 100%;

      height: 220px;

      border: 0;

      border-radius: 10px;
    }


    .upload-section {

      max-width: 800px;

      margin: 60px auto;

      padding: 30px;

      background: #111116;

      border: 1px solid #24222b;

      border-radius: 18px;
    }


    .upload-section h2 {

      margin-top: 0;
    }


    .upload-section input,
    .upload-section textarea {

      width: 100%;

      margin-bottom: 12px;

      padding: 13px;

      border-radius: 8px;

      border: 1px solid #33303a;

      background: #08080b;

      color: white;
    }


    .upload-section textarea {

      min-height: 100px;

      resize: vertical;
    }


    #uploadButton {

      width: 100%;

      padding: 14px;

      border: 0;

      border-radius: 9px;

      background:
        linear-gradient(
          90deg,
          #7200ff,
          #ff0066
        );

      color: white;

      font-weight: bold;

      cursor: pointer;
    }


    #uploadStatus {

      margin-top: 15px;

      color: #aaa;

      text-align: center;
    }


    footer {

      padding: 40px 20px;

      text-align: center;

      color: #666;

      border-top: 1px solid #1c1c20;
    }


    @media (max-width: 650px) {

      .search-area {

        flex-direction: column;
      }


      #searchButton {

        padding: 15px;
      }

    }

  </style>

</head>


<body>


<header>

  <h1 class="logo">
    MES MJAY MP4
  </h1>


  <p class="tagline">
    SEARCH • LISTEN • UPLOAD • DOWNLOAD
  </p>


  <div class="search-area">

    <input
      id="search"
      type="search"
      placeholder="Search songs, DJs or mixes..."
    >

    <button
      id="searchButton"
      onclick="searchEverything()"
    >
      SEARCH
    </button>

  </div>


  <div class="categories">

    <button
      class="category"
      onclick="categorySearch('Amapiano DJ Mix')"
    >
      🎧 Amapiano
    </button>


    <button
      class="category"
      onclick="categorySearch('Afro House DJ Mix')"
    >
      🔥 Afro House
    </button>


    <button
      class="category"
      onclick="categorySearch('Hip Hop DJ Mix')"
    >
      🎤 Hip Hop
    </button>


    <button
      class="category"
      onclick="categorySearch('Dancehall DJ Mix')"
    >
      💃 Dancehall
    </button>

  </div>

</header>


<main>


  <h2 class="section-title">
    🔥 SEARCH RESULTS
  </h2>


  <div id="status">
    Search for a song, DJ or mix.
  </div>


  <div id="results"></div>


  <!-- UPLOAD -->

  <section class="upload-section">

    <h2>
      📤 Upload Your Mix
    </h2>


    <p>
      Upload music or mixes that you own
      or have permission to distribute.
    </p>


    <input
      id="uploadTitle"
      type="text"
      placeholder="Mix title"
    >


    <input
      id="uploadArtist"
      type="text"
      placeholder="DJ / Artist name"
    >


    <input
      id="uploadGenre"
      type="text"
      placeholder="Genre"
    >


    <textarea
      id="uploadDescription"
      placeholder="Description"
    ></textarea>


    <input
      id="audioFile"
      type="file"
      accept="audio/mpeg,audio/mp4,audio/wav,video/mp4"
    >


    <button
      id="uploadButton"
      onclick="uploadMix()"
    >
      UPLOAD MIX
    </button>


    <div id="uploadStatus"></div>

  </section>

</main>


<footer>

  <strong>
    MES MJAY MP4
  </strong>

  <br><br>

  Search • Listen • Upload

</footer>


<script>


/* =====================================================
   SUPABASE CONNECTION
   ===================================================== */


const SUPABASE_URL =
  "https://wnlajqbpkwtwpaaeqkxj.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_PXAmzEH8fRfMkCH7czbiPA_kus8zu7R";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =====================================================
   YOUTUBE API
   ===================================================== */


const YOUTUBE_API_KEY =
  "AIzaSyAZ9ouKaTX-Q035oT8zomtGyW1yfW9zYZE";


/* =====================================================
   AUTHORIZED DOWNLOAD LINKS
   ===================================================== */


const DOWNLOADS = {};


/* =====================================================
   SEARCH EVERYTHING
   ===================================================== */


async function searchEverything() {

  const query =
    document
      .getElementById("search")
      .value
      .trim();


  if (!query) {

    document.getElementById("status")
      .textContent =
      "Type something to search.";

    return;
  }


  document.getElementById("status")
    .textContent =
    "🔎 Searching...";


  document.getElementById("results")
    .innerHTML = "";


  await searchYouTube(query);

  await searchMyUploads(query);

}


/* =====================================================
   YOUTUBE SEARCH
   ===================================================== */


async function searchYouTube(query) {

  if (
    YOUTUBE_API_KEY ===
    "AIzaSyAZ9ouKaTX-Q035oT8zomtGyW1yfW9zYZE"
  ) {

    return;
  }


  try {

    const url =
      "https://www.googleapis.com/youtube/v3/search" +

      "?part=snippet" +

      "&q=" +
      encodeURIComponent(query) +

      "&type=video" +

      "&videoEmbeddable=true" +

      "&maxResults=12" +

      "&key=" +
      encodeURIComponent(
        YOUTUBE_API_KEY
      );


    const response =
      await fetch(url);


    const data =
      await response.json();


    if (!response.ok) {

      console.error(data);

      return;
    }


    data.items.forEach(
      function(video) {

        const videoId =
          video.id.videoId;


        const card =
          document.createElement(
            "article"
          );


        card.className = "card";


        const thumbnail =
          video.snippet
            .thumbnails
            .high?.url;


        const title =
          escapeHTML(
            video.snippet.title
          );


        const channel =
          escapeHTML(
            video.snippet.channelTitle
          );


        let downloadHTML = "";


        if (DOWNLOADS[videoId]) {

          downloadHTML = `

            <a
              class="button download"
              href="${DOWNLOADS[videoId]}"
              download
              target="_blank"
              rel="noopener"
            >
              ⬇ DOWNLOAD
            </a>

          `;
        }


        card.innerHTML = `

          <img
            src="${thumbnail}"
            alt="${title}"
          >


          <div class="card-content">

            <div class="title">
              ${title}
            </div>


            <div class="artist">
              YouTube • ${channel}
            </div>


            <div class="buttons">

              <button
                class="button listen"
                onclick="playYouTube(
                  '${videoId}',
                  this
                )"
              >
                ▶ LISTEN
              </button>


              <a
                class="button youtube"
                href="https://www.youtube.com/watch?v=${videoId}"
                target="_blank"
                rel="noopener"
              >
                YouTube
              </a>


              ${downloadHTML}

            </div>


            <div class="player"></div>

          </div>

        `;


        document
          .getElementById("results")
          .appendChild(card);

      }
    );


    document.getElementById("status")
      .textContent =
      "Search results";

  }

  catch(error) {

    console.error(error);

  }

}


/* =====================================================
   SEARCH YOUR OWN UPLOADS
   ===================================================== */


async function searchMyUploads(query) {

  try {

    const { data, error } =
      await supabaseClient

        .from("mixes")

        .select("*")

        .or(
          `title.ilike.%${query}%,artist.ilike.%${query}%,genre.ilike.%${query}%`
        )

        .limit(30);


    if (error) {

      console.error(error);

      return;
    }


    data.forEach(
      function(mix) {

        const card =
          document.createElement(
            "article"
          );


        card.className = "card";


        const title =
          escapeHTML(
            mix.title
          );


        const artist =
          escapeHTML(
            mix.artist || "Unknown DJ"
          );


        const genre =
          escapeHTML(
            mix.genre || ""
          );


        const description =
          escapeHTML(
            mix.description || ""
          );


        card.innerHTML = `

          <div
            style="
              height:190px;
              display:flex;
              align-items:center;
              justify-content:center;
              background:
                linear-gradient(
                  135deg,
                  #7200ff,
                  #ff0066
                );
              font-size:55px;
            "
          >
            🎧
          </div>


          <div class="card-content">

            <div class="title">
              ${title}
            </div>


            <div class="artist">

              ${artist}

              ${genre
                ? " • " + genre
                : ""
              }

            </div>


            <div
              style="
                color:#888;
                font-size:13px;
                margin-bottom:15px;
              "
            >
              ${description}
            </div>


            <div class="buttons">

              <button
                class="button listen"
                onclick="
                  playAudio(
                    '${escapeAttribute(
                      mix.audio_url
                    )}',
                    this
                  )
                "
              >
                ▶ LISTEN
              </button>


              <a
                class="button download"
                href="${mix.audio_url}"
                download
                target="_blank"
                rel="noopener"
              >
                ⬇ DOWNLOAD
              </a>

            </div>


            <div class="player"></div>

          </div>

        `;


        document
          .getElementById("results")
          .appendChild(card);

      }
    );

  }

  catch(error) {

    console.error(error);

  }

}


/* =====================================================
   PLAY YOUTUBE
   ===================================================== */


function playYouTube(
  videoId,
  button
) {

  const card =
    button.closest(".card");


  const player =
    card.querySelector(".player");


  player.style.display =
    "block";


  player.innerHTML = `

    <iframe

      src="
        https://www.youtube.com/embed/${videoId}
      "

      title="YouTube player"

      allow="
        autoplay;
        encrypted-media;
        picture-in-picture
      "

      allowfullscreen>

    </iframe>

  `;

}


/* =====================================================
   PLAY UPLOADED AUDIO
   ===================================================== */


function playAudio(
  audioURL,
  button
) {

  const card =
    button.closest(".card");


  const player =
    card.querySelector(".player");


  player.style.display =
    "block";


  player.innerHTML = `

    <audio
      controls
      style="width:100%"
      src="${audioURL}"
    >
    </audio>

  `;

}


/* =====================================================
   UPLOAD MIX
   ===================================================== */


async function uploadMix() {

  const title =
    document
      .getElementById("uploadTitle")
      .value
      .trim();


  const artist =
    document
      .getElementById("uploadArtist")
      .value
      .trim();


  const genre =
    document
      .getElementById("uploadGenre")
      .value
      .trim();


  const description =
    document
      .getElementById("uploadDescription")
      .value
      .trim();


  const file =
    document
      .getElementById("audioFile")
      .files[0];


  const status =
    document
      .getElementById("uploadStatus");


  if (!title || !file) {

    status.textContent =
      "Please enter a title and choose a file.";

    return;
  }


  status.textContent =
    "Uploading...";


  try {

    const safeName =
      file.name
        .replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


    const filePath =
      Date.now() +
      "-" +
      safeName;


    const { error:
      storageError
    } = await supabaseClient

      .storage

      .from("mixes")

      .upload(
        filePath,
        file
      );


    if (storageError) {

      throw storageError;

    }


    const { data:
      publicData
    } =
      supabaseClient

        .storage

        .from("mixes")

        .getPublicUrl(
          filePath
        );


    const audioURL =
      publicData.publicUrl;


    const { error:
      databaseError
    } =
      await supabaseClient

        .from("mixes")

        .insert({

          title:
            title,

          artist:
            artist,

          genre:
            genre,

          description:
            description,

          audio_url:
            audioURL

        });


    if (databaseError) {

      throw databaseError;

    }


    status.textContent =
      "✅ Mix uploaded successfully!";


    document
      .getElementById("uploadTitle")
      .value = "";


    document
      .getElementById("uploadArtist")
      .value = "";


    document
      .getElementById("uploadGenre")
      .value = "";


    document
      .getElementById("uploadDescription")
      .value = "";


    document
      .getElementById("audioFile")
      .value = "";


  }

  catch(error) {

    console.error(error);


    status.textContent =
      "❌ Upload failed. We still need to configure the Supabase permissions.";

  }

}


/* =====================================================
   CATEGORY SEARCH
   ===================================================== */


function categorySearch(category) {

  document
    .getElementById("search")
    .value =
    category;


  searchEverything();

}


/* =====================================================
   ENTER KEY
   ===================================================== */


document
  .getElementById("search")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        searchEverything();

      }

    }
  );


/* =====================================================
   SECURITY HELPERS
   ===================================================== */


function escapeHTML(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(value) {

  return String(value)

    .replace(
      /\\/g,
      "\\\\"
    )

    .replace(
      /'/g,
      "\\'"
    );

}

</script>


</body>

</html>
