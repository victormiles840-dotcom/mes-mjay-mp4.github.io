<script>

/* =====================================================
   1. CONFIGURATION
===================================================== */

const SUPABASE_URL =
  "https://wnlajqbpkwtwpaaeqkxj.supabase.co";

/*
  Use your Supabase PUBLISHABLE key here.

  Never use a service_role or secret key in this file.
*/

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_PXAmzEH8fRfMkCH7czbiPA_kus8zu7R";


/*
  Use your restricted YouTube API key here.
*/

const YOUTUBE_API_KEY =
  "AIzaSyDGq8I_PFGnDOGa4FG9eq6Ulc_gWhcQcTE";


/* =====================================================
   2. SUPABASE CONNECTION
===================================================== */

let supabaseClient = null;

if (
  SUPABASE_PUBLISHABLE_KEY &&
  !SUPABASE_PUBLISHABLE_KEY.includes("YOUR_")
) {

  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

}


/* =====================================================
   3. SEARCH EVERYTHING
===================================================== */

async function searchEverything() {

  const query =
    document
      .getElementById("search")
      .value
      .trim();

  const results =
    document.getElementById("results");

  const status =
    document.getElementById("status");

  if (!query) {

    status.textContent =
      "Type a song, DJ or mix.";

    return;
  }

  results.innerHTML = "";

  status.textContent =
    "🔎 Searching YouTube and MES MJAY MP4...";

  await Promise.allSettled([
    searchYouTube(query),
    searchMyUploads(query)
  ]);

  if (!results.children.length) {

    status.textContent =
      "No results found.";

  } else {

    status.textContent =
      "✅ Results found";
  }

}


/* =====================================================
   4. YOUTUBE SEARCH
===================================================== */

async function searchYouTube(query) {

  if (
    !YOUTUBE_API_KEY ||
    YOUTUBE_API_KEY.includes("YOUR_")
  ) {

    showMessage(
      "YouTube",
      "YouTube API key has not been configured."
    );

    return;
  }

  try {

    const url =
      "https://www.googleapis.com/youtube/v3/search" +
      "?part=snippet" +
      "&q=" + encodeURIComponent(query) +
      "&type=video" +
      "&videoEmbeddable=true" +
      "&maxResults=12" +
      "&key=" + encodeURIComponent(YOUTUBE_API_KEY);

    const response =
      await fetch(url);

    const data =
      await response.json();

    if (!response.ok) {

      console.error(
        "YouTube API ERROR:",
        data
      );

      const reason =
        data?.error?.errors?.[0]?.reason;

      let message =
        data?.error?.message ||
        "YouTube API request failed.";

      if (reason === "keyInvalid") {

        message =
          "Your YouTube API key is invalid.";

      } else if (reason === "ipRefererBlocked") {

        message =
          "Your YouTube API key is blocked by its website restriction.";

      } else if (reason === "quotaExceeded") {

        message =
          "Your YouTube API quota has been exceeded.";

      }

      showMessage(
        "YouTube ERROR",
        message
      );

      return;
    }

    if (
      !data.items ||
      data.items.length === 0
    ) {

      showMessage(
        "YouTube",
        "No YouTube results found."
      );

      return;
    }

    data.items.forEach(video => {

      const videoId =
        video?.id?.videoId;

      if (!videoId) {
        return;
      }

      const title =
        escapeHTML(
          video.snippet.title
        );

      const channel =
        escapeHTML(
          video.snippet.channelTitle
        );

      const thumbnail =
        video.snippet.thumbnails.high?.url ||
        video.snippet.thumbnails.medium?.url ||
        video.snippet.thumbnails.default?.url ||
        "";

      const card =
        document.createElement("article");

      card.className = "card";

      card.innerHTML = `
        <img
          class="thumbnail"
          src="${escapeAttribute(thumbnail)}"
          alt="${title}"
        >

        <div class="card-content">

          <div class="source youtube-source">
            YOUTUBE
          </div>

          <div class="title">
            ${title}
          </div>

          <div class="artist">
            ${channel}
          </div>

          <div class="buttons">

            <button
              class="button listen"
              type="button"
              onclick="playYouTube('${escapeJS(videoId)}', this)"
            >
              ▶ LISTEN
            </button>

          </div>

          <div class="player"></div>

        </div>
      `;

      document
        .getElementById("results")
        .appendChild(card);

    });

  } catch (error) {

    console.error(
      "YouTube connection error:",
      error
    );

    showMessage(
      "YouTube",
      "Could not connect to YouTube."
    );
  }

}


/* =====================================================
   5. PLAY YOUTUBE INSIDE WEBSITE
===================================================== */

function playYouTube(
  videoId,
  button
) {

  const card =
    button.closest(".card");

  const player =
    card.querySelector(".player");

  player.style.display =
    "block";

  player.innerHTML = `
    <iframe
      src="https://www.youtube.com/embed/${encodeURIComponent(videoId)}"
      title="YouTube player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  `;
}


/* =====================================================
   6. SEARCH YOUR SUPABASE UPLOADS
===================================================== */

async function searchMyUploads(query) {

  if (!supabaseClient) {
    return;
  }

  try {

    const safeQuery =
      query
        .replace(/,/g, " ")
        .trim();

    const {
      data,
      error
    } =
      await supabaseClient
        .from("mixes")
        .select("*")
        .or(
          `title.ilike.%${safeQuery}%,artist.ilike.%${safeQuery}%,genre.ilike.%${safeQuery}%`
        )
        .limit(30);

    if (error) {

      console.error(
        "Supabase search error:",
        error
      );

      return;
    }

    if (!data?.length) {
      return;
    }

    data.forEach(mix => {

      const title =
        escapeHTML(
          mix.title || "Untitled Mix"
        );

      const artist =
        escapeHTML(
          mix.artist || "Unknown DJ"
        );

      const genre =
        escapeHTML(
          mix.genre || ""
        );

      const description =
        escapeHTML(
          mix.description || ""
        );

      const audioURL =
        String(
          mix.audio_url || ""
        );

      if (!audioURL) {
        return;
      }

      const card =
        document.createElement("article");

      card.className = "card";

      card.innerHTML = `
        <div class="placeholder">
          🎧
        </div>

        <div class="card-content">

          <div class="source local-source">
            MES MJAY MP4
          </div>

          <div class="title">
            ${title}
          </div>

          <div class="artist">
            ${artist}
            ${genre ? " • " + genre : ""}
          </div>

          <div class="description">
            ${description}
          </div>

          <div class="buttons">

            <button
              class="button listen"
              type="button"
              onclick="playAudio('${escapeJS(audioURL)}', this)"
            >
              ▶ LISTEN
            </button>

            <a
              class="button download"
              href="${escapeAttribute(audioURL)}"
              download
              target="_blank"
              rel="noopener noreferrer"
            >
              ⬇ DOWNLOAD
            </a>

          </div>

          <div class="player"></div>

        </div>
      `;

      document
        .getElementById("results")
        .appendChild(card);

    });

  } catch (error) {

    console.error(
      "Supabase search error:",
      error
    );

  }

}


/* =====================================================
   7. PLAY YOUR OWN AUDIO
===================================================== */

function playAudio(
  audioURL,
  button
) {

  const card =
    button.closest(".card");

  const player =
    card.querySelector(".player");

  player.style.display =
    "block";

  player.innerHTML = `
    <audio
      controls
      preload="metadata"
      src="${escapeAttribute(audioURL)}">
    </audio>
  `;
}


/* =====================================================
   8. UPLOAD YOUR OWN MIX
===================================================== */

async function uploadMix() {

  const status =
    document.getElementById("uploadStatus");

  const uploadButton =
    document.getElementById("uploadButton");

  /*
    This appears immediately.
    Therefore we know the button actually worked.
  */

  status.textContent =
    "⏳ Upload button clicked...";

  if (!supabaseClient) {

    status.textContent =
      "❌ Supabase is not configured. Check your publishable key.";

    return;
  }

  const title =
    document
      .getElementById("uploadTitle")
      .value
      .trim();

  const artist =
    document
      .getElementById("uploadArtist")
      .value
      .trim();

  const genre =
    document
      .getElementById("uploadGenre")
      .value
      .trim();

  const description =
    document
      .getElementById("uploadDescription")
      .value
      .trim();

  const fileInput =
    document.getElementById("audioFile");

  const file =
    fileInput.files[0];

  if (!title) {

    status.textContent =
      "❌ Enter a mix title.";

    return;
  }

  if (!file) {

    status.textContent =
      "❌ Choose an audio file.";

    return;
  }

  /*
    Basic file-size protection.
    Change this if your Supabase plan allows larger files.
  */

  const maxSize =
    100 * 1024 * 1024;

  if (file.size > maxSize) {

    status.textContent =
      "❌ File is larger than 100 MB.";

    return;
  }

  uploadButton.disabled = true;

  status.textContent =
    "⏳ Uploading file...";

  try {

    const safeName =
      file.name
        .replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );

    const filePath =
      Date.now() +
      "-" +
      safeName;

    /*
      Upload file to Storage
    */

    const {
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from("mixes")
        .upload(
          filePath,
          file,
          {
            cacheControl: "3600",
            upsert: false
          }
        );

    if (uploadError) {

      console.error(
        "Storage upload error:",
        uploadError
      );

      throw uploadError;
    }

    status.textContent =
      "⏳ File uploaded. Saving mix information...";

    /*
      Get public URL
    */

    const {
      data: publicData
    } =
      supabaseClient
        .storage
        .from("mixes")
        .getPublicUrl(filePath);

    const audioURL =
      publicData?.publicUrl;

    if (!audioURL) {

      throw new Error(
        "Could not create the public file URL."
      );
    }

    /*
      Save information in database
    */

    const {
      error: databaseError
    } =
      await supabaseClient
        .from("mixes")
        .insert({
          title: title,
          artist: artist,
          genre: genre,
          description: description,
          audio_url: audioURL
        });

    if (databaseError) {

      console.error(
        "Database error:",
        databaseError
      );

      throw databaseError;
    }

    /*
      SUCCESS
    */

    status.textContent =
      "✅ MIX UPLOADED SUCCESSFULLY!";

    document
      .getElementById("uploadTitle")
      .value = "";

    document
      .getElementById("uploadArtist")
      .value = "";

    document
      .getElementById("uploadGenre")
      .value = "";

    document
      .getElementById("uploadDescription")
      .value = "";

    document
      .getElementById("audioFile")
      .value = "";

  } catch (error) {

    console.error(
      "Upload error:",
      error
    );

    status.textContent =
      "❌ Upload failed: " +
      (
        error?.message ||
        "Unknown error"
      );

  } finally {

    uploadButton.disabled = false;

  }

}


/* =====================================================
   9. CATEGORY BUTTONS
===================================================== */

document
  .querySelectorAll(".category")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .getElementById("search")
          .value =
          button.dataset.query;

        searchEverything();

      }
    );

  });


/* =====================================================
   10. SEARCH BUTTON
===================================================== */

document
  .getElementById("searchButton")
  .addEventListener(
    "click",
    searchEverything
  );


/* =====================================================
   11. ENTER KEY
===================================================== */

document
  .getElementById("search")
  .addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {

        searchEverything();

      }

    }
  );


/* =====================================================
   12. UPLOAD BUTTON
===================================================== */

document
  .getElementById("uploadButton")
  .addEventListener(
    "click",
    uploadMix
  );


/* =====================================================
   13. MESSAGE
===================================================== */

function showMessage(
  source,
  message
) {

  const card =
    document.createElement("article");

  card.className =
    "card";

  card.innerHTML = `
    <div class="placeholder">
      🔎
    </div>

    <div class="card-content">

      <div class="source">
        ${escapeHTML(source)}
      </div>

      <div class="title">
        ${escapeHTML(message)}
      </div>

    </div>
  `;

  document
    .getElementById("results")
    .appendChild(card);

}


/* =====================================================
   14. SECURITY HELPERS
===================================================== */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeJS(value) {

  return String(value)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\r/g, "\\r")
    .replace(/\n/g, "\\n");

}


function escapeAttribute(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>
